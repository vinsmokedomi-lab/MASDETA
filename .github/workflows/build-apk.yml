          cat << 'EOF' > "$JAVA_DIR/MasdetaChatNotifierPlugin.java"
          package com.masdeta.app;

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;
          import org.json.JSONArray;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "MasdetaChatNotifier")
          public class MasdetaChatNotifierPlugin extends Plugin {
            @PluginMethod
            public void configure(PluginCall call) {
              Context ctx = getContext();
              SharedPreferences prefs = ctx.getSharedPreferences(ChatPollWorker.PREFS_NAME, Context.MODE_PRIVATE);

              String userId = call.getString("userId", "");
              String supabaseUrl = call.getString("supabaseUrl", "");
              String supabaseAnonKey = call.getString("supabaseAnonKey", "");
              String apiBaseUrl = call.getString("apiBaseUrl", "");
              String sessionToken = call.getString("sessionToken", "");
              String incomingLastSeen = call.getString("lastSeenAt", "");
              boolean enabled = call.getBoolean("enabled", true);

              JSObject senderNamesObj = call.getObject("senderNames");
              String senderNamesJson = senderNamesObj != null ? senderNamesObj.toString() : "{}";

              // Merge notifiedIds with existing native IDs so already-pushed IDs never repeat
              Set<String> mergedSet = new HashSet<>();
              List<String> mergedList = new ArrayList<>();
              try {
                JSONArray existing = new JSONArray(prefs.getString("notifiedIdsJson", "[]"));
                for (int i = 0; i < existing.length(); i++) {
                  String id = existing.optString(i, "");
                  if (!id.isEmpty() && mergedSet.add(id)) mergedList.add(id);
                }
              } catch (Exception ignored) {}
              try {
                JSONArray incomingIds = call.getArray("notifiedIds");
                if (incomingIds != null) {
                  for (int i = 0; i < incomingIds.length(); i++) {
                    String id = incomingIds.optString(i, "");
                    if (!id.isEmpty() && mergedSet.add(id)) mergedList.add(id);
                  }
                }
              } catch (Exception ignored) {}
              JSONArray cappedIds = new JSONArray();
              int startIdx = Math.max(0, mergedList.size() - 120);
              for (int i = startIdx; i < mergedList.size(); i++) {
                cappedIds.put(mergedList.get(i));
              }

              String prevLastSeen = prefs.getString("lastSeenAt", "");
              String chosenLastSeen = ChatPollWorker.parseIsoMillis(prevLastSeen) > ChatPollWorker.parseIsoMillis(incomingLastSeen)
                ? prevLastSeen
                : (incomingLastSeen != null ? incomingLastSeen : "");

              prefs.edit()
                .putString("userId", userId != null ? userId : "")
                .putString("supabaseUrl", supabaseUrl != null ? supabaseUrl : "")
                .putString("supabaseAnonKey", supabaseAnonKey != null ? supabaseAnonKey : "")
                .putString("apiBaseUrl", apiBaseUrl != null ? apiBaseUrl : "")
                .putString("sessionToken", sessionToken != null ? sessionToken : "")
                .putString("senderNamesJson", senderNamesJson)
                .putString("notifiedIdsJson", cappedIds.toString())
                .putString("lastSeenAt", chosenLastSeen)
                .putBoolean("enabled", enabled)
                .apply();

              ChatPollWorker.ensureChannel(ctx);
              if (enabled && userId != null && !userId.trim().isEmpty()) {
                ChatPollReceiver.scheduleNext(ctx, 25000L);
                ChatPollJobService.scheduleJob(ctx);
              } else {
                ChatPollReceiver.cancel(ctx);
                ChatPollJobService.cancelJob(ctx);
              }
              call.resolve();
            }

            @PluginMethod
            public void setForeground(PluginCall call) {
              Context ctx = getContext();
              boolean isFg = call.getBoolean("isForeground", false);
              SharedPreferences prefs = ctx.getSharedPreferences(ChatPollWorker.PREFS_NAME, Context.MODE_PRIVATE);
              prefs.edit().putBoolean("isForeground", isFg).apply();
              if (!isFg) {
                ChatPollReceiver.scheduleNext(ctx, 20000L);
                ChatPollJobService.scheduleJob(ctx);
              }
              call.resolve();
            }

            @PluginMethod
            public void setEnabled(PluginCall call) {
              Context ctx = getContext();
              boolean enabled = call.getBoolean("enabled", true);
              SharedPreferences prefs = ctx.getSharedPreferences(ChatPollWorker.PREFS_NAME, Context.MODE_PRIVATE);
              prefs.edit().putBoolean("enabled", enabled).apply();
              if (enabled) {
                ChatPollReceiver.scheduleNext(ctx, 25000L);
                ChatPollJobService.scheduleJob(ctx);
              } else {
                ChatPollReceiver.cancel(ctx);
                ChatPollJobService.cancelJob(ctx);
              }
              call.resolve();
            }

            @PluginMethod
            public void markNotified(PluginCall call) {
              Context ctx = getContext();
              SharedPreferences prefs = ctx.getSharedPreferences(ChatPollWorker.PREFS_NAME, Context.MODE_PRIVATE);
              Set<String> set = new HashSet<>();
              List<String> list = new ArrayList<>();
              try {
                JSONArray existing = new JSONArray(prefs.getString("notifiedIdsJson", "[]"));
                for (int i = 0; i < existing.length(); i++) {
                  String id = existing.optString(i, "");
                  if (!id.isEmpty() && set.add(id)) list.add(id);
                }
              } catch (Exception ignored) {}
              try {
                JSONArray ids = call.getArray("ids");
                if (ids != null) {
                  for (int i = 0; i < ids.length(); i++) {
                    String id = ids.optString(i, "");
                    if (!id.isEmpty() && set.add(id)) list.add(id);
                  }
                }
              } catch (Exception ignored) {}

              JSONArray capped = new JSONArray();
              int startIdx = Math.max(0, list.size() - 120);
              for (int i = startIdx; i < list.size(); i++) {
                capped.put(list.get(i));
              }

              String incomingLastSeen = call.getString("lastSeenAt", "");
              String prevLastSeen = prefs.getString("lastSeenAt", "");
              SharedPreferences.Editor ed = prefs.edit().putString("notifiedIdsJson", capped.toString());
              if (ChatPollWorker.parseIsoMillis(incomingLastSeen) > ChatPollWorker.parseIsoMillis(prevLastSeen)) {
                ed.putString("lastSeenAt", incomingLastSeen);
              }
              ed.apply();
              call.resolve();
            }

            @PluginMethod
            public void consumePendingSender(PluginCall call) {
              String senderId = null;
              Intent actIntent = getActivity() != null ? getActivity().getIntent() : null;
              if (actIntent != null && actIntent.hasExtra(ChatPollWorker.EXTRA_SENDER_ID)) {
                senderId = actIntent.getStringExtra(ChatPollWorker.EXTRA_SENDER_ID);
                actIntent.removeExtra(ChatPollWorker.EXTRA_SENDER_ID);
              }
              JSObject res = new JSObject();
              if (senderId != null && !senderId.isEmpty()) {
                res.put("senderId", senderId);
              }
              call.resolve(res);
            }

            @PluginMethod
            public void clear(PluginCall call) {
              Context ctx = getContext();
              ctx.getSharedPreferences(ChatPollWorker.PREFS_NAME, Context.MODE_PRIVATE).edit().clear().apply();
              ChatPollReceiver.cancel(ctx);
              ChatPollJobService.cancelJob(ctx);
              call.resolve();
            }
          }
