name: Build & Release MASDETA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build & Publish MASDETA APK
    runs-on: ubuntu-latest
    env:
      CI: true
      CAPACITOR_TELEMETRY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Set Dynamic App Version
        id: ver
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          VERSION_CODE=$((100 + BUILD_NUM))
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

          if [ -f "src/config/appVersion.ts" ]; then
            cat << EOF > src/config/appVersion.ts
          export const APP_VERSION = "${VERSION_NAME}";
          export const APP_VERSION_CODE = ${VERSION_CODE};
          export const GITHUB_REPO = "vinsmokedomi-lab/MASDETA";
          EOF
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GAS_UPLOAD_URL: ${{ secrets.VITE_GAS_UPLOAD_URL }}
          VITE_GAS_API_KEY: ${{ secrets.VITE_GAS_API_KEY }}
        run: npm run build

      - name: Ensure Capacitor JSON config
        run: |
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.masdeta.app",
            "appName": "MASDETA",
            "webDir": "dist",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate MASDETA Launcher Icons
        run: |
          SVG_PATH="public/masdeta-icon.svg"
          if [ ! -f "$SVG_PATH" ]; then
            cat << 'EOF' > /tmp/masdeta-fallback.svg
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
              <rect width="512" height="512" rx="112" fill="#0F766E"/>
              <path d="M128 368V144h44l84 128 84-128h44v224h-44V222l-84 126-84-126v146h-44z" fill="#FFFFFF"/>
            </svg>
          EOF
            SVG_PATH="/tmp/masdeta-fallback.svg"
          fi

          declare -A SIZES=( ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192 )
          declare -A FG_SIZES=( ["mdpi"]=108 ["hdpi"]=162 ["xhdpi"]=216 ["xxhdpi"]=324 ["xxxhdpi"]=432 )

          for DENSITY in "${!SIZES[@]}"; do
            RES_DIR="android/app/src/main/res/mipmap-${DENSITY}"
            mkdir -p "$RES_DIR"
            rsvg-convert -w ${SIZES[$DENSITY]} -h ${SIZES[$DENSITY]} "$SVG_PATH" -o "$RES_DIR/ic_launcher.png"
            rsvg-convert -w ${SIZES[$DENSITY]} -h ${SIZES[$DENSITY]} "$SVG_PATH" -o "$RES_DIR/ic_launcher_round.png"
            rsvg-convert -w ${FG_SIZES[$DENSITY]} -h ${FG_SIZES[$DENSITY]} "$SVG_PATH" -o "$RES_DIR/ic_launcher_foreground.png"
          done

          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0F766E</color>
          </resources>
          EOF

      - name: Configure Android Permissions, Versioning & Release Signing
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_NAME: ${{ secrets.KEY_ALIAS }}
          VER_NAME: ${{ steps.ver.outputs.version_name }}
          VER_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          PASS="${STORE_PASS:-MasdetaRelease2026!}"
          ALIAS="${KEY_ALIAS_NAME:-masdeta_key}"

          keytool -genkeypair -v \
            -keystore android/app/masdeta-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias "$ALIAS" \
            -dname "CN=MASDETA, OU=IT, O=MASDETA, L=Pontianak, ST=Kalimantan Barat, C=ID"

          node -e '
            const fs = require("fs");

            // 1. Inject permissions into AndroidManifest.xml
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "android.permission.CAMERA",
              "android.permission.REQUEST_INSTALL_PACKAGES"
            ];
            for (const p of perms) {
              if (!xml.includes(p)) {
                xml = xml.replace("<application", `    <uses-permission android:name="${p}" />\n    <application`);
              }
            }
            fs.writeFileSync(manifestPath, xml);

            // 2. Configure signingConfigs & version in android/app/build.gradle
            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${process.env.VER_CODE}`);
            gradle = gradle.replace(/versionName\s+"[^"]+"/, `versionName "${process.env.VER_NAME}"`);

            const signingBlock = `
                signingConfigs {
                    release {
                        storeFile file("masdeta-release.jks")
                        storePassword "${process.env.STORE_PASS || "MasdetaRelease2026!"}"
                        keyAlias "${process.env.KEY_ALIAS_NAME || "masdeta_key"}"
                        keyPassword "${process.env.STORE_PASS || "MasdetaRelease2026!"}"
                    }
                }
            `;

            if (!gradle.includes("signingConfigs")) {
              gradle = gradle.replace("buildTypes {", `${signingBlock}\n    buildTypes {`);
              gradle = gradle.replace(
                /release\s*\{/,
                `release {\n            signingConfig signingConfigs.release`
              );
            }
            fs.writeFileSync(gradlePath, gradle);
          '

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Signed Release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename Release APK
        run: |
          APK_FILE="MASDETA-v${{ steps.ver.outputs.version_name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "${APK_FILE}"
          ls -lh "${APK_FILE}"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ver.outputs.version_name }}"
          name: "MASDETA v${{ steps.ver.outputs.version_name }}"
          body: |
            Pembaruan resmi aplikasi **MASDETA v${{ steps.ver.outputs.version_name }}**.
            - Pembaruan antarmuka & fitur terbaru
            - Mendukung pembaruan langsung dari dalam aplikasi Android
          files: MASDETA-v${{ steps.ver.outputs.version_name }}.apk
          generate_release_notes: false
