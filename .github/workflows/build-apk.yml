name: Build & Release MASDETA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build & Publish MASDETA APK
    runs-on: ubuntu-latest
    env:
      CI: true
      CAPACITOR_TELEMETRY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('package-lock.json') }}-v1
          restore-keys: |
            gradle-android-

      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Set Dynamic App Version
        id: ver
        env:
          BUILD_NUM: ${{ github.run_number }}
        run: |
          eval "$(node -e '
            const fs = require("fs");
            const buildNum = Number(process.env.BUILD_NUM || "1") || 1;
            let majorMinor = "1.1";
            let patchBase = 21;
            try {
              const cfg = JSON.parse(fs.readFileSync("release-version.json", "utf8"));
              if (cfg && typeof cfg.majorMinor === "string" && cfg.majorMinor.trim()) {
                majorMinor = cfg.majorMinor.trim();
              }
              if (cfg && Number.isFinite(Number(cfg.patchBaseRunNumber))) {
                patchBase = Number(cfg.patchBaseRunNumber);
              }
            } catch {}
            const patch = buildNum > patchBase ? (buildNum - patchBase) : buildNum;
            const versionName = `${majorMinor}.${patch}`;
            const versionCode = 100 + buildNum;
            console.log(`VERSION_NAME=${versionName}`);
            console.log(`VERSION_CODE=${versionCode}`);
          ')"
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          mkdir -p src/config
          printf 'export const APP_VERSION = "%s";\nexport const APP_VERSION_CODE = %s;\nexport const GITHUB_REPO = "vinsmokedomi-lab/MASDETA";\n' "$VERSION_NAME" "$VERSION_CODE" > src/config/appVersion.ts

      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 5000
          npm config set fetch-retry-maxtimeout 60000
          for attempt in 1 2 3; do
            echo "npm install attempt $attempt/3..."
            if npm install --legacy-peer-deps --no-audit --no-fund; then
              exit 0
            fi
            echo "npm install gagal (percobaan $attempt/3), mencoba ulang dalam 5 detik..."
            sleep 5
          done
          exit 1

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GAS_UPLOAD_URL: ${{ secrets.VITE_GAS_UPLOAD_URL }}
          VITE_GAS_API_KEY: ${{ secrets.VITE_GAS_API_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Ensure Capacitor JSON config
        run: |
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.masdeta.app",
            "appName": "MASDETA",
            "webDir": "dist",
            "android": {
              "allowMixedContent": true
            },
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_masdeta",
                "iconColor": "#0F766E"
              }
            }
          }
          EOF

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Install CekBansos Native Android Plugin
        run: |
          JAVA_DIR="android/app/src/main/java/com/masdeta/app"
          mkdir -p "$JAVA_DIR"
          cat << 'EOF' > "$JAVA_DIR/CekBansosPlugin.java"
          package com.masdeta.app;

          import android.app.Dialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "CekBansos")
          public class CekBansosPlugin extends Plugin {
            private static final String TARGET_URL = "https://cekbansos.kemensos.go.id/";

            @PluginMethod
            public void open(PluginCall call) {
              String rawNik = call.getString("nik", "");
              final String nik = rawNik != null ? rawNik.replaceAll("[^0-9]", "") : "";
              if (nik.isEmpty()) {
                call.reject("NIK KTP tidak valid");
                return;
              }

              getActivity().runOnUiThread(() -> {
                Context ctx = getActivity();
                ClipboardManager clipboard = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);
                if (clipboard != null) {
                  clipboard.setPrimaryClip(ClipData.newPlainText("NIK KTP", nik));
                }

                final Dialog dialog = new Dialog(ctx, android.R.style.Theme_DeviceDefault_Light_NoActionBar_Fullscreen);

                LinearLayout root = new LinearLayout(ctx);
                root.setOrientation(LinearLayout.VERTICAL);
                root.setBackgroundColor(Color.WHITE);
                root.setLayoutParams(new ViewGroup.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT,
                  ViewGroup.LayoutParams.MATCH_PARENT
                ));

                LinearLayout topBar = new LinearLayout(ctx);
                topBar.setOrientation(LinearLayout.HORIZONTAL);
                topBar.setGravity(Gravity.CENTER_VERTICAL);
                topBar.setBackgroundColor(Color.parseColor("#0F766E"));
                int padH = dp(ctx, 14);
                int padV = dp(ctx, 10);
                topBar.setPadding(padH, padV, padH, padV);

                LinearLayout titleCol = new LinearLayout(ctx);
                titleCol.setOrientation(LinearLayout.VERTICAL);
                LinearLayout.LayoutParams titleColParams = new LinearLayout.LayoutParams(
                  0,
                  ViewGroup.LayoutParams.WRAP_CONTENT,
                  1.0f
                );
                titleCol.setLayoutParams(titleColParams);

                TextView titleTv = new TextView(ctx);
                titleTv.setText("Cek Bansos Kemensos");
                titleTv.setTextColor(Color.WHITE);
                titleTv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15);
                titleTv.setTypeface(Typeface.DEFAULT_BOLD);
                titleTv.setSingleLine(true);
                titleTv.setEllipsize(TextUtils.TruncateAt.END);

                TextView nikTv = new TextView(ctx);
                nikTv.setText("NIK: " + nik);
                nikTv.setTextColor(Color.parseColor("#CCFBF1"));
                nikTv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                nikTv.setSingleLine(true);

                titleCol.addView(titleTv);
                titleCol.addView(nikTv);

                Button copyBtn = new Button(ctx);
                copyBtn.setText("Salin");
                copyBtn.setTextColor(Color.WHITE);
                copyBtn.setBackgroundColor(Color.parseColor("#115E59"));
                copyBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                copyBtn.setPadding(dp(ctx, 10), dp(ctx, 4), dp(ctx, 10), dp(ctx, 4));
                LinearLayout.LayoutParams copyParams = new LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.WRAP_CONTENT,
                  dp(ctx, 36)
                );
                copyParams.setMarginEnd(dp(ctx, 8));
                copyBtn.setLayoutParams(copyParams);
                copyBtn.setOnClickListener(v -> {
                  ClipboardManager cm = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);
                  if (cm != null) {
                    cm.setPrimaryClip(ClipData.newPlainText("NIK KTP", nik));
                    Toast.makeText(ctx, "NIK disalin ke clipboard", Toast.LENGTH_SHORT).show();
                  }
                });

                Button closeBtn = new Button(ctx);
                closeBtn.setText("Tutup");
                closeBtn.setTextColor(Color.parseColor("#0F172A"));
                closeBtn.setBackgroundColor(Color.WHITE);
                closeBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                closeBtn.setPadding(dp(ctx, 12), dp(ctx, 4), dp(ctx, 12), dp(ctx, 4));
                closeBtn.setLayoutParams(new LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.WRAP_CONTENT,
                  dp(ctx, 36)
                ));
                closeBtn.setOnClickListener(v -> dialog.dismiss());

                topBar.addView(titleCol);
                topBar.addView(copyBtn);
                topBar.addView(closeBtn);

                final ProgressBar progressBar = new ProgressBar(ctx, null, android.R.attr.progressBarStyleHorizontal);
                progressBar.setMax(100);
                progressBar.setLayoutParams(new LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT,
                  dp(ctx, 3)
                ));

                final WebView webView = new WebView(ctx);
                webView.setLayoutParams(new LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT,
                  0,
                  1.0f
                ));

                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setSupportZoom(true);
                settings.setBuiltInZoomControls(true);
                settings.setDisplayZoomControls(false);

                CookieManager cookieManager = CookieManager.getInstance();
                cookieManager.setAcceptCookie(true);
                cookieManager.setAcceptThirdPartyCookies(webView, true);

                webView.setWebChromeClient(new WebChromeClient() {
                  @Override
                  public void onProgressChanged(WebView view, int newProgress) {
                    progressBar.setProgress(newProgress);
                    progressBar.setVisibility(newProgress < 100 ? ProgressBar.VISIBLE : ProgressBar.GONE);
                  }
                });

                webView.setWebViewClient(new WebViewClient() {
                  @Override
                  public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                    return false;
                  }

                  @Override
                  public void onPageFinished(WebView view, String url) {
                    super.onPageFinished(view, url);
                    String quotedNik = JSONObject.quote(nik);
                    String script =
                      "(function(){" +
                      "var nik=" + quotedNik + ";" +
                      "function setReactVal(el,val){" +
                      "  try{" +
                      "    var desc=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value');" +
                      "    if(desc&&desc.set){desc.set.call(el,val);}else{el.value=val;}" +
                      "    el.dispatchEvent(new Event('input',{bubbles:true}));" +
                      "    el.dispatchEvent(new Event('change',{bubbles:true}));" +
                      "  }catch(e){el.value=val;}" +
                      "}" +
                      "function tryFill(){" +
                      "  var inputs=Array.prototype.slice.call(document.querySelectorAll('input'));" +
                      "  var nikInput=inputs.find(function(el){" +
                      "    var hay=((el.placeholder||'')+' '+(el.name||'')+' '+(el.id||'')+' '+(el.getAttribute('aria-label')||'')).toLowerCase();" +
                      "    return hay.indexOf('nik')!==-1||hay.indexOf('16 digit')!==-1||el.maxLength===16;" +
                      "  });" +
                      "  if(!nikInput){" +
                      "    nikInput=inputs.find(function(el){" +
                      "      var t=(el.type||'text').toLowerCase();" +
                      "      if(t==='hidden'||t==='submit'||t==='button'||t==='checkbox'||t==='radio')return false;" +
                      "      var hay=((el.placeholder||'')+' '+(el.name||'')+' '+(el.id||'')).toLowerCase();" +
                      "      return hay.indexOf('captcha')===-1&&hay.indexOf('kode')===-1&&hay.indexOf('huruf')===-1;" +
                      "    });" +
                      "  }" +
                      "  if(nikInput&&nikInput.value!==nik){" +
                      "    setReactVal(nikInput,nik);" +
                      "    var captchaInput=inputs.find(function(el){" +
                      "      var hay=((el.placeholder||'')+' '+(el.name||'')+' '+(el.id||'')).toLowerCase();" +
                      "      return el!==nikInput&&(hay.indexOf('captcha')!==-1||hay.indexOf('kode')!==-1||hay.indexOf('huruf')!==-1);" +
                      "    });" +
                      "    if(captchaInput){try{captchaInput.focus();}catch(e){}}" +
                      "    return true;" +
                      "  }" +
                      "  return false;" +
                      "}" +
                      "var tries=0;" +
                      "var timer=setInterval(function(){" +
                      "  tries++;" +
                      "  if(tryFill()||tries>=25){clearInterval(timer);}" +
                      "},300);" +
                      "tryFill();" +
                      "})();";
                    view.evaluateJavascript(script, null);
                  }
                });

                root.addView(topBar);
                root.addView(progressBar);
                root.addView(webView);
                dialog.setContentView(root);
                dialog.setOnDismissListener(d -> {
                  webView.stopLoading();
                  webView.destroy();
                });
                dialog.show();
                webView.loadUrl(TARGET_URL);
              });

              call.resolve();
            }

            private int dp(Context ctx, int dpVal) {
              return (int) TypedValue.applyDimension(
                TypedValue.COMPLEX_UNIT_DIP,
                dpVal,
                ctx.getResources().getDisplayMetrics()
              );
            }
          }
          EOF

          cat << 'EOF' > "$JAVA_DIR/ChatPollWorker.java"
          package com.masdeta.app;

          import android.Manifest;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import androidx.core.content.ContextCompat;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.TimeZone;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public final class ChatPollWorker {
            public static final String PREFS_NAME = "masdeta_chat_bg_prefs";
            public static final String CHANNEL_ID = "masdeta_chat_v2";
            public static final String EXTRA_SENDER_ID = "masdeta_chat_sender_id";

            private ChatPollWorker() {}

            public static void ensureChannel(Context ctx) {
              if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return;
              NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
              if (nm == null) return;
              try {
                nm.deleteNotificationChannel("masdeta_chat");
              } catch (Exception ignored) {}
              if (nm.getNotificationChannel(CHANNEL_ID) == null) {
                NotificationChannel channel = new NotificationChannel(
                  CHANNEL_ID,
                  "Pesan Masuk MASDETA",
                  NotificationManager.IMPORTANCE_HIGH
                );
                channel.setDescription("Notifikasi pesan chat langsung dengan suara dan tampilan layar kunci");
                channel.enableLights(true);
                channel.setLightColor(0xFF0F766E);
                channel.enableVibration(true);
                channel.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);
                Uri soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                AudioAttributes attrs = new AudioAttributes.Builder()
                  .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                  .build();
                channel.setSound(soundUri, attrs);
                nm.createNotificationChannel(channel);
              }
            }

            public static synchronized void pollOnce(Context ctx) {
              SharedPreferences prefs = ctx.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
              boolean enabled = prefs.getBoolean("enabled", true);
              boolean isForeground = prefs.getBoolean("isForeground", false);
              String userId = prefs.getString("userId", "");
              if (!enabled || isForeground || userId == null || userId.trim().isEmpty()) {
                return;
              }
              if (Build.VERSION.SDK_INT >= 33 &&
                ContextCompat.checkSelfPermission(ctx, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                return;
              }

              String supabaseUrl = prefs.getString("supabaseUrl", "");
              String supabaseAnonKey = prefs.getString("supabaseAnonKey", "");
              String apiBaseUrl = prefs.getString("apiBaseUrl", "");
              String sessionToken = prefs.getString("sessionToken", "");
              String lastSeenAt = prefs.getString("lastSeenAt", "");
              String senderNamesRaw = prefs.getString("senderNamesJson", "{}");
              String notifiedRaw = prefs.getString("notifiedIdsJson", "[]");

              JSONObject senderNames;
              try {
                senderNames = new JSONObject(senderNamesRaw != null ? senderNamesRaw : "{}");
              } catch (Exception e) {
                senderNames = new JSONObject();
              }

              Set<String> notifiedSet = new HashSet<>();
              List<String> notifiedList = new ArrayList<>();
              try {
                JSONArray arr = new JSONArray(notifiedRaw != null ? notifiedRaw : "[]");
                for (int i = 0; i < arr.length(); i++) {
                  String id = arr.optString(i, "");
                  if (!id.isEmpty() && notifiedSet.add(id)) {
                    notifiedList.add(id);
                  }
                }
              } catch (Exception ignored) {}

              long lastSeenMs = parseIsoMillis(lastSeenAt);
              JSONArray unreadMessages = null;
              boolean usedSupabase = false;

              if (supabaseUrl != null && !supabaseUrl.isEmpty() && supabaseAnonKey != null && !supabaseAnonKey.isEmpty()) {
                unreadMessages = fetchFromSupabase(supabaseUrl, supabaseAnonKey, userId);
                if (unreadMessages != null) {
                  usedSupabase = true;
                }
              }

              if (unreadMessages == null && apiBaseUrl != null && !apiBaseUrl.isEmpty() && sessionToken != null && !sessionToken.isEmpty()) {
                unreadMessages = fetchFromBackend(apiBaseUrl, sessionToken, userId);
              }

              if (unreadMessages == null || unreadMessages.length() == 0) {
                return;
              }

              Map<String, Integer> totalUnreadBySender = new HashMap<>();
              Map<String, JSONObject> latestNewBySender = new HashMap<>();
              List<String> newlyDeliveredIds = new ArrayList<>();
              String maxCreatedIso = lastSeenAt != null ? lastSeenAt : "";
              long maxCreatedMs = lastSeenMs;

              for (int i = 0; i < unreadMessages.length(); i++) {
                JSONObject row = unreadMessages.optJSONObject(i);
                if (row == null) continue;
                String msgId = row.optString("id", "");
                String senderId = row.optString("sender_id", row.optString("senderId", ""));
                String recipientId = row.optString("recipient_id", row.optString("recipientId", ""));
                String readAt = row.optString("read_at", row.optString("readAt", ""));
                String deliveredAt = row.optString("delivered_at", row.optString("deliveredAt", ""));
                String createdAt = row.optString("created_at", row.optString("createdAt", ""));

                if (!userId.equals(recipientId) || msgId.isEmpty() || senderId.isEmpty()) continue;
                if (readAt != null && !readAt.isEmpty() && !"null".equals(readAt)) continue;

                totalUnreadBySender.put(senderId, totalUnreadBySender.getOrDefault(senderId, 0) + 1);
                if (deliveredAt == null || deliveredAt.isEmpty() || "null".equals(deliveredAt)) {
                  newlyDeliveredIds.add(msgId);
                }

                long msgMs = parseIsoMillis(createdAt);
                if (notifiedSet.contains(msgId)) continue;
                if (lastSeenMs > 0 && msgMs > 0 && msgMs <= lastSeenMs) continue;

                notifiedSet.add(msgId);
                notifiedList.add(msgId);
                latestNewBySender.put(senderId, row);
                if (msgMs > maxCreatedMs) {
                  maxCreatedMs = msgMs;
                  maxCreatedIso = createdAt;
                }
              }

              if (latestNewBySender.isEmpty()) {
                return;
              }

              ensureChannel(ctx);
              NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
              if (nm != null) {
                int smallIcon = ctx.getResources().getIdentifier("ic_stat_masdeta", "drawable", ctx.getPackageName());
                if (smallIcon == 0) {
                  smallIcon = ctx.getApplicationInfo().icon;
                }

                for (Map.Entry<String, JSONObject> entry : latestNewBySender.entrySet()) {
                  String senderId = entry.getKey();
                  JSONObject msg = entry.getValue();
                  String senderName = senderNames.optString(senderId, "");
                  if (senderName == null || senderName.trim().isEmpty()) {
                    senderName = "Pengguna Internal";
                  }
                  int count = totalUnreadBySender.getOrDefault(senderId, 1);
                  if (count < 1) count = 1;
                  String title = count + " pesan masuk dari " + senderName;

                  String text = msg.optString("text", "");
                  if (text == null || text.trim().isEmpty() || "null".equals(text)) {
                    JSONObject snap = msg.optJSONObject("shared_kpm_snapshot");
                    if (snap == null) snap = msg.optJSONObject("sharedKpm");
                    String kpmName = snap != null ? snap.optString("nama", "") : "";
                    text = !kpmName.isEmpty() ? ("Kartu KPM: " + kpmName) : "Pesan baru";
                  }

                  Intent openIntent = new Intent(ctx, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  openIntent.putExtra(EXTRA_SENDER_ID, senderId);
                  int notifId = Math.max(100, Math.abs(("chat:" + senderId).hashCode()) % 2000000000);
                  int piFlags = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
                  PendingIntent pendingIntent = PendingIntent.getActivity(ctx, notifId, openIntent, piFlags);

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(ctx, CHANNEL_ID)
                    .setSmallIcon(smallIcon)
                    .setColor(0xFF0F766E)
                    .setContentTitle(title)
                    .setContentText(text)
                    .setStyle(new NotificationCompat.BigTextStyle().bigText(text))
                    .setPriority(NotificationCompat.PRIORITY_MAX)
                    .setCategory(NotificationCompat.CATEGORY_MESSAGE)
                    .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                    .setDefaults(NotificationCompat.DEFAULT_ALL)
                    .setAutoCancel(true)
                    .setContentIntent(pendingIntent);

                  nm.notify(notifId, builder.build());
                }
              }

              // Simpan state agar pesan tidak diulang notifikasinya
              int keepFrom = Math.max(0, notifiedList.size() - 120);
              JSONArray savedIds = new JSONArray();
              for (int i = keepFrom; i < notifiedList.size(); i++) {
                savedIds.put(notifiedList.get(i));
              }
              SharedPreferences.Editor ed = prefs.edit();
              ed.putString("notifiedIdsJson", savedIds.toString());
              if (maxCreatedIso != null && !maxCreatedIso.isEmpty()) {
                ed.putString("lastSeenAt", maxCreatedIso);
              }
              ed.apply();

              if (usedSupabase && !newlyDeliveredIds.isEmpty()) {
                markDeliveredInSupabaseBestEffort(supabaseUrl, supabaseAnonKey, newlyDeliveredIds);
              } else if (!usedSupabase && apiBaseUrl != null && !apiBaseUrl.isEmpty() && sessionToken != null && !sessionToken.isEmpty() && !newlyDeliveredIds.isEmpty()) {
                markDeliveredInBackendBestEffort(apiBaseUrl, sessionToken, newlyDeliveredIds);
              }
            }

            private static JSONArray fetchFromSupabase(String baseUrl, String anonKey, String userId) {
              HttpURLConnection conn = null;
              try {
                String cleanUrl = baseUrl.replaceAll("/+$", "");
                String encodedUid = URLEncoder.encode(userId, "UTF-8");
                String endpoint = cleanUrl + "/rest/v1/direct_chat_messages?recipient_id=eq." + encodedUid + "&read_at=is.null&order=created_at.asc&limit=40";
                conn = (HttpURLConnection) new URL(endpoint).openConnection();
                conn.setRequestMethod("GET");
                conn.setConnectTimeout(8000);
                conn.setReadTimeout(8000);
                conn.setRequestProperty("apikey", anonKey);
                conn.setRequestProperty("Authorization", "Bearer " + anonKey);
                conn.setRequestProperty("Accept", "application/json");
                int code = conn.getResponseCode();
                if (code < 200 || code >= 300) return null;
                try (BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8))) {
                  StringBuilder sb = new StringBuilder();
                  String line;
                  while ((line = br.readLine()) != null) sb.append(line);
                  return new JSONArray(sb.toString());
                }
              } catch (Exception e) {
                return null;
              } finally {
                if (conn != null) conn.disconnect();
              }
            }

            private static JSONArray fetchFromBackend(String apiBaseUrl, String token, String userId) {
              HttpURLConnection conn = null;
              try {
                String cleanUrl = apiBaseUrl.replaceAll("/+$", "");
                conn = (HttpURLConnection) new URL(cleanUrl + "/api/collab/state").openConnection();
                conn.setRequestMethod("GET");
                conn.setConnectTimeout(8000);
                conn.setReadTimeout(8000);
                conn.setRequestProperty("Authorization", "Bearer " + token);
                conn.setRequestProperty("Accept", "application/json");
                int code = conn.getResponseCode();
                if (code < 200 || code >= 300) return null;
                try (BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), StandardCharsets.UTF_8))) {
                  StringBuilder sb = new StringBuilder();
                  String line;
                  while ((line = br.readLine()) != null) sb.append(line);
                  JSONObject obj = new JSONObject(sb.toString());
                  return obj.optJSONArray("messages");
                }
              } catch (Exception e) {
                return null;
              } finally {
                if (conn != null) conn.disconnect();
              }
            }

            private static void markDeliveredInSupabaseBestEffort(String baseUrl, String anonKey, List<String> ids) {
              HttpURLConnection conn = null;
              try {
                StringBuilder inList = new StringBuilder();
                for (int i = 0; i < Math.min(ids.size(), 30); i++) {
                  if (i > 0) inList.append(",");
                  inList.append(URLEncoder.encode(ids.get(i), "UTF-8"));
                }
                String cleanUrl = baseUrl.replaceAll("/+$", "");
                String endpoint = cleanUrl + "/rest/v1/direct_chat_messages?id=in.(" + inList + ")&delivered_at=is.null";
                conn = (HttpURLConnection) new URL(endpoint).openConnection();
                conn.setRequestMethod("PATCH");
                conn.setDoOutput(true);
                conn.setConnectTimeout(5000);
                conn.setReadTimeout(5000);
                conn.setRequestProperty("apikey", anonKey);
                conn.setRequestProperty("Authorization", "Bearer " + anonKey);
                conn.setRequestProperty("Content-Type", "application/json");
                SimpleDateFormat isoFmt = new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US);
                isoFmt.setTimeZone(TimeZone.getTimeZone("UTC"));
                String body = "{\"delivered_at\":\"" + isoFmt.format(new Date()) + "\"}";
                try (OutputStream os = conn.getOutputStream()) {
                  os.write(body.getBytes(StandardCharsets.UTF_8));
                }
                conn.getResponseCode();
              } catch (Exception ignored) {
              } finally {
                if (conn != null) conn.disconnect();
              }
            }

            private static void markDeliveredInBackendBestEffort(String apiBaseUrl, String token, List<String> ids) {
              HttpURLConnection conn = null;
              try {
                String cleanUrl = apiBaseUrl.replaceAll("/+$", "");
                conn = (HttpURLConnection) new URL(cleanUrl + "/api/chat/delivered").openConnection();
                conn.setRequestMethod("POST");
                conn.setDoOutput(true);
                conn.setConnectTimeout(5000);
                conn.setReadTimeout(5000);
                conn.setRequestProperty("Authorization", "Bearer " + token);
                conn.setRequestProperty("Content-Type", "application/json");
                JSONObject payload = new JSONObject();
                payload.put("messageIds", new JSONArray(ids));
                try (OutputStream os = conn.getOutputStream()) {
                  os.write(payload.toString().getBytes(StandardCharsets.UTF_8));
                }
                conn.getResponseCode();
              } catch (Exception ignored) {
              } finally {
                if (conn != null) conn.disconnect();
              }
            }

            public static long parseIsoMillis(String iso) {
              if (iso == null || iso.trim().isEmpty()) return 0L;
              try {
                String s = iso.trim();
                // Normalize fractional seconds and +00:00 -> Z
                s = s.replaceAll("\\.[0-9]+", "");
                if (s.endsWith("Z")) {
                  SimpleDateFormat sdf = new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", Locale.US);
                  sdf.setTimeZone(TimeZone.getTimeZone("UTC"));
                  Date d = sdf.parse(s);
                  return d != null ? d.getTime() : 0L;
                }
                s = s.replaceAll("([+-]\\d{2}):(\\d{2})$", "$1$2");
                SimpleDateFormat sdf = new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ssZ", Locale.US);
                Date d = sdf.parse(s);
                return d != null ? d.getTime() : 0L;
              } catch (Exception e) {
                return 0L;
              }
            }
          }
