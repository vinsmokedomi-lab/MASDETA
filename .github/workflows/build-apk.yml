          cat << 'EOF' > "$JAVA_DIR/ChatPollReceiver.java"
          package com.masdeta.app;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.PowerManager;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class ChatPollReceiver extends BroadcastReceiver {
            public static final String ACTION_POLL = "com.masdeta.app.ACTION_CHAT_POLL";
            private static final int REQUEST_CODE = 40821;
            private static final ExecutorService EXECUTOR = Executors.newSingleThreadExecutor();

            public static void scheduleNext(Context ctx, long delayMs) {
              SharedPreferences prefs = ctx.getSharedPreferences(ChatPollWorker.PREFS_NAME, Context.MODE_PRIVATE);
              if (!prefs.getBoolean("enabled", true)) return;
              String uid = prefs.getString("userId", "");
              if (uid == null || uid.trim().isEmpty()) return;

              AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
              if (am == null) return;

              Intent intent = new Intent(ctx, ChatPollReceiver.class);
              intent.setAction(ACTION_POLL);
              int flags = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
              PendingIntent pi = PendingIntent.getBroadcast(ctx, REQUEST_CODE, intent, flags);
              long triggerAt = System.currentTimeMillis() + Math.max(15000L, delayMs);

              try {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                  am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, triggerAt, pi);
                } else {
                  am.set(AlarmManager.RTC_WAKEUP, triggerAt, pi);
                }
              } catch (Exception ignored) {}
            }

            public static void cancel(Context ctx) {
              AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
              if (am == null) return;
              Intent intent = new Intent(ctx, ChatPollReceiver.class);
              intent.setAction(ACTION_POLL);
              int flags = PendingIntent.FLAG_NO_CREATE | (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M ? PendingIntent.FLAG_IMMUTABLE : 0);
              PendingIntent pi = PendingIntent.getBroadcast(ctx, REQUEST_CODE, intent, flags);
              if (pi != null) {
                am.cancel(pi);
                pi.cancel();
              }
            }

            @Override
            public void onReceive(Context context, Intent intent) {
              final Context appCtx = context.getApplicationContext();
              final PendingResult pendingResult = goAsync();
              EXECUTOR.execute(() -> {
                PowerManager.WakeLock wakeLock = null;
                try {
                  PowerManager pm = (PowerManager) appCtx.getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                    wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "masdeta:chatpoll");
                    wakeLock.acquire(12000L);
                  }
                  ChatPollWorker.pollOnce(appCtx);
                } catch (Exception ignored) {
                } finally {
                  scheduleNext(appCtx, 30000L);
                  ChatPollJobService.scheduleJob(appCtx);
                  if (wakeLock != null && wakeLock.isHeld()) {
                    try {
                      wakeLock.release();
                    } catch (Exception ignored) {}
                  }
                  pendingResult.finish();
                }
              });
            }
          }
          EOF

          cat << 'EOF' > "$JAVA_DIR/ChatPollJobService.java"
          package com.masdeta.app;

          import android.app.job.JobInfo;
          import android.app.job.JobParameters;
          import android.app.job.JobScheduler;
          import android.app.job.JobService;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.SharedPreferences;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class ChatPollJobService extends JobService {
            private static final int JOB_ID = 40822;
            private static final ExecutorService EXECUTOR = Executors.newSingleThreadExecutor();

            public static void scheduleJob(Context ctx) {
              SharedPreferences prefs = ctx.getSharedPreferences(ChatPollWorker.PREFS_NAME, Context.MODE_PRIVATE);
              if (!prefs.getBoolean("enabled", true)) return;
              String uid = prefs.getString("userId", "");
              if (uid == null || uid.trim().isEmpty()) return;

              JobScheduler scheduler = (JobScheduler) ctx.getSystemService(Context.JOB_SCHEDULER_SERVICE);
              if (scheduler == null) return;
              if (scheduler.getPendingJob(JOB_ID) != null) return;

              ComponentName serviceName = new ComponentName(ctx, ChatPollJobService.class);
              JobInfo job = new JobInfo.Builder(JOB_ID, serviceName)
                .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                .setPersisted(true)
                .setPeriodic(15 * 60 * 1000L)
                .build();
              scheduler.schedule(job);
            }

            public static void cancelJob(Context ctx) {
              JobScheduler scheduler = (JobScheduler) ctx.getSystemService(Context.JOB_SCHEDULER_SERVICE);
              if (scheduler != null) {
                scheduler.cancel(JOB_ID);
              }
            }

            @Override
            public boolean onStartJob(JobParameters params) {
              final Context appCtx = getApplicationContext();
              EXECUTOR.execute(() -> {
                try {
                  ChatPollWorker.pollOnce(appCtx);
                  ChatPollReceiver.scheduleNext(appCtx, 30000L);
                } finally {
                  jobFinished(params, false);
                }
              });
              return true;
            }

            @Override
            public boolean onStopJob(JobParameters params) {
              return true;
            }
          }
