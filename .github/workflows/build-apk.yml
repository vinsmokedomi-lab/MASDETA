name: Build & Release MASDETA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build & Publish MASDETA APK
    runs-on: ubuntu-latest
    env:
      CI: true
      CAPACITOR_TELEMETRY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Set Dynamic App Version
        id: ver
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          VERSION_CODE=$((100 + BUILD_NUM))
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          mkdir -p src/config
          printf 'export const APP_VERSION = "%s";\nexport const APP_VERSION_CODE = %s;\nexport const GITHUB_REPO = "vinsmokedomi-lab/MASDETA";\n' "$VERSION_NAME" "$VERSION_CODE" > src/config/appVersion.ts

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GAS_UPLOAD_URL: ${{ secrets.VITE_GAS_UPLOAD_URL }}
          VITE_GAS_API_KEY: ${{ secrets.VITE_GAS_API_KEY }}
        run: npm run build

      - name: Ensure Capacitor JSON config
        run: |
          rm -f capacitor.config.ts
          printf '{\n  "appId": "com.masdeta.app",\n  "appName": "MASDETA",\n  "webDir": "dist",\n  "android": {\n    "allowMixedContent": true\n  }\n}\n' > capacitor.config.json

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Install CekBansos Native Android Plugin
        run: |
          JAVA_DIR="android/app/src/main/java/com/masdeta/app"
          mkdir -p "$JAVA_DIR"
          cat << 'EOF' > "$JAVA_DIR/CekBansosPlugin.java"
          package com.masdeta.app;

          import android.app.Dialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.text.TextUtils;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "CekBansos")
          public class CekBansosPlugin extends Plugin {
            private static final String TARGET_URL = "https://cekbansos.kemensos.go.id/";

            @PluginMethod
            public void open(PluginCall call) {
              String rawNik = call.getString("nik", "");
              final String nik = rawNik != null ? rawNik.replaceAll("[^0-9]", "") : "";
              if (nik.isEmpty()) {
                call.reject("NIK KTP tidak valid");
                return;
              }

              getActivity().runOnUiThread(() -> {
                Context ctx = getActivity();
                ClipboardManager clipboard = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);
                if (clipboard != null) {
                  clipboard.setPrimaryClip(ClipData.newPlainText("NIK KTP", nik));
                }

                final Dialog dialog = new Dialog(ctx, android.R.style.Theme_DeviceDefault_Light_NoActionBar_Fullscreen);

                LinearLayout root = new LinearLayout(ctx);
                root.setOrientation(LinearLayout.VERTICAL);
                root.setBackgroundColor(Color.WHITE);
                root.setLayoutParams(new ViewGroup.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT,
                  ViewGroup.LayoutParams.MATCH_PARENT
                ));

                LinearLayout topBar = new LinearLayout(ctx);
                topBar.setOrientation(LinearLayout.HORIZONTAL);
                topBar.setGravity(Gravity.CENTER_VERTICAL);
                topBar.setBackgroundColor(Color.parseColor("#0F766E"));
                int padH = dp(ctx, 14);
                int padV = dp(ctx, 10);
                topBar.setPadding(padH, padV, padH, padV);

                LinearLayout titleCol = new LinearLayout(ctx);
                titleCol.setOrientation(LinearLayout.VERTICAL);
                LinearLayout.LayoutParams titleColParams = new LinearLayout.LayoutParams(
                  0,
                  ViewGroup.LayoutParams.WRAP_CONTENT,
                  1.0f
                );
                titleCol.setLayoutParams(titleColParams);

                TextView titleTv = new TextView(ctx);
                titleTv.setText("Cek Bansos Kemensos");
                titleTv.setTextColor(Color.WHITE);
                titleTv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15);
                titleTv.setTypeface(Typeface.DEFAULT_BOLD);
                titleTv.setSingleLine(true);
                titleTv.setEllipsize(TextUtils.TruncateAt.END);

                TextView nikTv = new TextView(ctx);
                nikTv.setText("NIK: " + nik);
                nikTv.setTextColor(Color.parseColor("#CCFBF1"));
                nikTv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                nikTv.setSingleLine(true);

                titleCol.addView(titleTv);
                titleCol.addView(nikTv);

                Button copyBtn = new Button(ctx);
                copyBtn.setText("Salin");
                copyBtn.setTextColor(Color.WHITE);
                copyBtn.setBackgroundColor(Color.parseColor("#115E59"));
                copyBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                copyBtn.setPadding(dp(ctx, 10), dp(ctx, 4), dp(ctx, 10), dp(ctx, 4));
                LinearLayout.LayoutParams copyParams = new LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.WRAP_CONTENT,
                  dp(ctx, 36)
                );
                copyParams.setMarginEnd(dp(ctx, 8));
                copyBtn.setLayoutParams(copyParams);
                copyBtn.setOnClickListener(v -> {
                  ClipboardManager cm = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);
                  if (cm != null) {
                    cm.setPrimaryClip(ClipData.newPlainText("NIK KTP", nik));
                    Toast.makeText(ctx, "NIK disalin ke clipboard", Toast.LENGTH_SHORT).show();
                  }
                });

                Button closeBtn = new Button(ctx);
                closeBtn.setText("Tutup");
                closeBtn.setTextColor(Color.parseColor("#0F172A"));
                closeBtn.setBackgroundColor(Color.WHITE);
                closeBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                closeBtn.setPadding(dp(ctx, 12), dp(ctx, 4), dp(ctx, 12), dp(ctx, 4));
                closeBtn.setLayoutParams(new LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.WRAP_CONTENT,
                  dp(ctx, 36)
                ));
                closeBtn.setOnClickListener(v -> dialog.dismiss());

                topBar.addView(titleCol);
                topBar.addView(copyBtn);
                topBar.addView(closeBtn);

                final ProgressBar progressBar = new ProgressBar(ctx, null, android.R.attr.progressBarStyleHorizontal);
                progressBar.setMax(100);
                progressBar.setLayoutParams(new LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT,
                  dp(ctx, 3)
                ));

                final WebView webView = new WebView(ctx);
                webView.setLayoutParams(new LinearLayout.LayoutParams(
                  ViewGroup.LayoutParams.MATCH_PARENT,
                  0,
                  1.0f
                ));

                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setSupportZoom(true);
                settings.setBuiltInZoomControls(true);
                settings.setDisplayZoomControls(false);

                CookieManager cookieManager = CookieManager.getInstance();
                cookieManager.setAcceptCookie(true);
                cookieManager.setAcceptThirdPartyCookies(webView, true);

                webView.setWebChromeClient(new WebChromeClient() {
                  @Override
                  public void onProgressChanged(WebView view, int newProgress) {
                    progressBar.setProgress(newProgress);
                    progressBar.setVisibility(newProgress < 100 ? ProgressBar.VISIBLE : ProgressBar.GONE);
                  }
                });

                webView.setWebViewClient(new WebViewClient() {
                  @Override
                  public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                    return false;
                  }

                  @Override
                  public void onPageFinished(WebView view, String url) {
                    super.onPageFinished(view, url);
                    String quotedNik = JSONObject.quote(nik);
                    String script =
                      "(function(){" +
                      "var nik=" + quotedNik + ";" +
                      "function setReactVal(el,val){" +
                      "  try{" +
                      "    var desc=Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype,'value');" +
                      "    if(desc&&desc.set){desc.set.call(el,val);}else{el.value=val;}" +
                      "    el.dispatchEvent(new Event('input',{bubbles:true}));" +
                      "    el.dispatchEvent(new Event('change',{bubbles:true}));" +
                      "  }catch(e){el.value=val;}" +
                      "}" +
                      "function tryFill(){" +
                      "  var inputs=Array.prototype.slice.call(document.querySelectorAll('input'));" +
                      "  var nikInput=inputs.find(function(el){" +
                      "    var hay=((el.placeholder||'')+' '+(el.name||'')+' '+(el.id||'')+' '+(el.getAttribute('aria-label')||'')).toLowerCase();" +
                      "    return hay.indexOf('nik')!==-1||hay.indexOf('16 digit')!==-1||el.maxLength===16;" +
                      "  });" +
                      "  if(!nikInput){" +
                      "    nikInput=inputs.find(function(el){" +
                      "      var t=(el.type||'text').toLowerCase();" +
                      "      if(t==='hidden'||t==='submit'||t==='button'||t==='checkbox'||t==='radio')return false;" +
                      "      var hay=((el.placeholder||'')+' '+(el.name||'')+' '+(el.id||'')).toLowerCase();" +
                      "      return hay.indexOf('captcha')===-1&&hay.indexOf('kode')===-1&&hay.indexOf('huruf')===-1;" +
                      "    });" +
                      "  }" +
                      "  if(nikInput&&nikInput.value!==nik){" +
                      "    setReactVal(nikInput,nik);" +
                      "    var captchaInput=inputs.find(function(el){" +
                      "      var hay=((el.placeholder||'')+' '+(el.name||'')+' '+(el.id||'')).toLowerCase();" +
                      "      return el!==nikInput&&(hay.indexOf('captcha')!==-1||hay.indexOf('kode')!==-1||hay.indexOf('huruf')!==-1);" +
                      "    });" +
                      "    if(captchaInput){try{captchaInput.focus();}catch(e){}}" +
                      "    return true;" +
                      "  }" +
                      "  return false;" +
                      "}" +
                      "var tries=0;" +
                      "var timer=setInterval(function(){" +
                      "  tries++;" +
                      "  if(tryFill()||tries>=25){clearInterval(timer);}" +
                      "},300);" +
                      "tryFill();" +
                      "})();";
                    view.evaluateJavascript(script, null);
                  }
                });

                root.addView(topBar);
                root.addView(progressBar);
                root.addView(webView);
                dialog.setContentView(root);
                dialog.setOnDismissListener(d -> {
                  webView.stopLoading();
                  webView.destroy();
                });
                dialog.show();
                webView.loadUrl(TARGET_URL);
              });

              call.resolve();
            }

            private int dp(Context ctx, int dpVal) {
              return (int) TypedValue.applyDimension(
                TypedValue.COMPLEX_UNIT_DIP,
                dpVal,
                ctx.getResources().getDisplayMetrics()
              );
            }
          }
          EOF

          MAIN_ACT="$JAVA_DIR/MainActivity.java"
          node -e '
            const fs = require("fs");
            const path = process.argv[1];
            let src = fs.readFileSync(path, "utf8");
            if (!src.includes("CekBansosPlugin.class")) {
              if (!src.includes("import android.os.Bundle;")) {
                src = src.replace("import com.getcapacitor.BridgeActivity;", "import android.os.Bundle;\nimport com.getcapacitor.BridgeActivity;");
              }
              if (src.includes("onCreate(")) {
                src = src.replace(/super\.onCreate\([^)]*\);/, (m) => `registerPlugin(CekBansosPlugin.class);\n    ${m}`);
              } else {
                src = src.replace(
                  /public class MainActivity extends BridgeActivity\s*\{\s*\}/,
                  `public class MainActivity extends BridgeActivity {\n  @Override\n  public void onCreate(Bundle savedInstanceState) {\n    registerPlugin(CekBansosPlugin.class);\n    super.onCreate(savedInstanceState);\n  }\n}`
                );
              }
              fs.writeFileSync(path, src);
            }
          ' "$MAIN_ACT"

      - name: Generate MASDETA Launcher Icons
        run: |
          # OG MasdetaLogo paths centered inside Android Adaptive Icon 72dp/108dp safe zone (scale = 512 * 2/3 / 36 = 9.481481)
          cat << 'EOF' > /tmp/masdeta-adaptive-fg.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
            <g transform="translate(85.3333, 87.7037) scale(9.481481)">
              <path
                d="M9 24.5V12.5C9 11.6716 9.67157 11 10.5 11H12.05C12.5672 11 13.0478 11.2663 13.3219 11.7049L18 19.1899L22.6781 11.7049C22.9522 11.2663 23.4328 11 23.95 11H25.5C26.3284 11 27 11.6716 27 12.5V24.5"
                stroke="#FFFFFF"
                stroke-width="2.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M14.5 24.5L18 19.5L21.5 24.5"
                stroke="#99F6E4"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </g>
          </svg>
          EOF

          # Legacy full-bleed square & round icons for older Android launchers / APK installer previews
          cat << 'EOF' > /tmp/masdeta-legacy-square.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
            <rect width="512" height="512" fill="#0F766E" />
            <g transform="translate(0, 3.5556) scale(14.222222)">
              <path
                d="M9 24.5V12.5C9 11.6716 9.67157 11 10.5 11H12.05C12.5672 11 13.0478 11.2663 13.3219 11.7049L18 19.1899L22.6781 11.7049C22.9522 11.2663 23.4328 11 23.95 11H25.5C26.3284 11 27 11.6716 27 12.5V24.5"
                stroke="#FFFFFF"
                stroke-width="2.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M14.5 24.5L18 19.5L21.5 24.5"
                stroke="#99F6E4"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </g>
          </svg>
          EOF

          cat << 'EOF' > /tmp/masdeta-legacy-round.svg
          <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
            <circle cx="256" cy="256" r="256" fill="#0F766E" />
            <g transform="translate(0, 3.5556) scale(14.222222)">
              <path
                d="M9 24.5V12.5C9 11.6716 9.67157 11 10.5 11H12.05C12.5672 11 13.0478 11.2663 13.3219 11.7049L18 19.1899L22.6781 11.7049C22.9522 11.2663 23.4328 11 23.95 11H25.5C26.3284 11 27 11.6716 27 12.5V24.5"
                stroke="#FFFFFF"
                stroke-width="2.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M14.5 24.5L18 19.5L21.5 24.5"
                stroke="#99F6E4"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </g>
          </svg>
          EOF

          for PAIR in "mdpi:48:108" "hdpi:72:162" "xhdpi:96:216" "xxhdpi:144:324" "xxxhdpi:192:432"; do
            DENSITY="${PAIR%%:*}"
            REST="${PAIR#*:}"
            SZ="${REST%%:*}"
            FGSZ="${REST#*:}"
            RES_DIR="android/app/src/main/res/mipmap-${DENSITY}"
            mkdir -p "$RES_DIR"
            rsvg-convert -w "$SZ" -h "$SZ" /tmp/masdeta-legacy-square.svg -o "$RES_DIR/ic_launcher.png"
            rsvg-convert -w "$SZ" -h "$SZ" /tmp/masdeta-legacy-round.svg -o "$RES_DIR/ic_launcher_round.png"
            rsvg-convert -w "$FGSZ" -h "$FGSZ" /tmp/masdeta-adaptive-fg.svg -o "$RES_DIR/ic_launcher_foreground.png"
          done

          mkdir -p android/app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#0F766E</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml

          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Configure Deterministic Keystore, Permissions & Gradle Signing
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_NAME: ${{ secrets.KEY_ALIAS }}
          VER_NAME: ${{ steps.ver.outputs.version_name }}
          VER_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          PASS="${STORE_PASS:-MasdetaRelease2026!}"
          ALIAS="${KEY_ALIAS_NAME:-masdeta_key}"

          python3 -c '
          import hashlib, math, os

          seed_str = (os.environ.get("STORE_PASS") or "MasdetaRelease2026!") + ":" + (os.environ.get("KEY_ALIAS_NAME") or "masdeta_key")
          state = hashlib.sha256(seed_str.encode()).digest()

          def next_bytes(n):
              global state
              out = bytearray()
              while len(out) < n:
                  state = hashlib.sha256(state).digest()
                  out.extend(state)
              return bytes(out[:n])

          SMALL_PRIMES = [p for p in range(3, 1000, 2) if all(p % d != 0 for d in range(3, int(p**0.5) + 1, 2))]

          def is_prime(n):
              for p in SMALL_PRIMES:
                  if n % p == 0:
                      return n == p
              d, r = n - 1, 0
              while d % 2 == 0:
                  d //= 2
                  r += 1
              for _ in range(16):
                  a = 2 + int.from_bytes(next_bytes(128), "big") % (n - 4)
                  x = pow(a, d, n)
                  if x == 1 or x == n - 1:
                      continue
                  for _ in range(r - 1):
                      x = pow(x, 2, n)
                      if x == n - 1:
                          break
                  else:
                      return False
              return True

          def make_prime(bits):
              while True:
                  raw = bytearray(next_bytes(bits // 8))
                  raw[0] |= 0xC0
                  raw[-1] |= 0x01
                  cand = int.from_bytes(raw, "big")
                  if is_prime(cand):
                      return cand

          e = 65537
          while True:
              p = make_prime(1024)
              q = make_prime(1024)
              if p != q and math.gcd(e, (p - 1) * (q - 1)) == 1:
                  break

          n = p * q
          phi = (p - 1) * (q - 1)
          d = pow(e, -1, phi)
          dp = d % (p - 1)
          dq = d % (q - 1)
          qinv = pow(q, -1, p)

          def der_len(length):
              if length < 128:
                  return bytes([length])
              b = length.to_bytes((length.bit_length() + 7) // 8, "big")
              return bytes([0x80 | len(b)]) + b

          def der_int(val):
              b = val.to_bytes((val.bit_length() + 8) // 8, "big")
              return b"\x02" + der_len(len(b)) + b

          body = b"".join(der_int(v) for v in (0, n, e, d, p, q, dp, dq, qinv))
          with open("/tmp/masdeta_key.der", "wb") as f:
              f.write(b"\x30" + der_len(len(body)) + body)
          '

          openssl rsa -inform DER -in /tmp/masdeta_key.der -out /tmp/masdeta_key.pem
          openssl req -new -x509 -key /tmp/masdeta_key.pem -out /tmp/masdeta_cert.pem \
            -not_before 20260101000000Z -not_after 20550101000000Z -set_serial 1 \
            -subj "/CN=MASDETA/OU=IT/O=MASDETA/L=Pontianak/ST=Kalimantan Barat/C=ID"
          openssl pkcs12 -export -in /tmp/masdeta_cert.pem -inkey /tmp/masdeta_key.pem \
            -out /tmp/masdeta.p12 -name "$ALIAS" -passout "pass:$PASS"

          rm -f android/app/masdeta-release.jks
          keytool -importkeystore \
            -srckeystore /tmp/masdeta.p12 -srcstoretype PKCS12 -srcstorepass "$PASS" \
            -destkeystore android/app/masdeta-release.jks -deststoretype JKS -deststorepass "$PASS" \
            -alias "$ALIAS"

          node -e '
            const fs = require("fs");

            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            const perms = [
              "android.permission.CAMERA",
              "android.permission.REQUEST_INSTALL_PACKAGES"
            ];
            for (const p of perms) {
              if (!xml.includes(p)) {
                xml = xml.replace("<application", `    <uses-permission android:name="${p}" />\n    <application`);
              }
            }
            fs.writeFileSync(manifestPath, xml);

            const gradlePath = "android/app/build.gradle";
            let gradle = fs.readFileSync(gradlePath, "utf8");
            gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${process.env.VER_CODE}`);
            gradle = gradle.replace(/versionName\s+"[^"]+"/, `versionName "${process.env.VER_NAME}"`);

            const signingAppend = `
          android {
              signingConfigs {
                  release {
                      storeFile file("masdeta-release.jks")
                      storePassword System.getenv("STORE_PASS") ?: "MasdetaRelease2026!"
                      keyAlias System.getenv("KEY_ALIAS_NAME") ?: "masdeta_key"
                      keyPassword System.getenv("STORE_PASS") ?: "MasdetaRelease2026!"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          `;

            if (!gradle.includes("masdeta-release.jks")) {
              gradle = gradle + "\n" + signingAppend;
            }
            fs.writeFileSync(gradlePath, gradle);
          '

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Signed Release APK
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_NAME: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename Release APK
        run: |
          APK_FILE="MASDETA-v${{ steps.ver.outputs.version_name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "${APK_FILE}"
          ls -lh "${APK_FILE}"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.ver.outputs.version_name }}"
