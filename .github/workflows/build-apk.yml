name: Build MASDETA Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      CI: true
      CAPACITOR_TELEMETRY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SVG converter for Android Icon
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GAS_UPLOAD_URL: ${{ secrets.VITE_GAS_UPLOAD_URL }}
          VITE_GAS_API_KEY: ${{ secrets.VITE_GAS_API_KEY }}
        run: npm run build

      - name: Replace TS config with JSON config
        run: |
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.masdeta.app",
            "appName": "MASDETA",
            "webDir": "dist",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate MASDETA Android Launcher Icons
        run: |
          SVG_PATH="public/masdeta-icon.svg"
          if [ ! -f "$SVG_PATH" ]; then
            cat << 'EOF' > /tmp/masdeta-fallback.svg
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
              <rect width="512" height="512" rx="112" fill="#0F766E"/>
              <path d="M128 368V144h44l84 128 84-128h44v224h-44V222l-84 126-84-126v146h-44z" fill="#FFFFFF"/>
            </svg>
          EOF
            SVG_PATH="/tmp/masdeta-fallback.svg"
          fi

          declare -A SIZES=( ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192 )
          declare -A FG_SIZES=( ["mdpi"]=108 ["hdpi"]=162 ["xhdpi"]=216 ["xxhdpi"]=324 ["xxxhdpi"]=432 )

          for DENSITY in "${!SIZES[@]}"; do
            RES_DIR="android/app/src/main/res/mipmap-${DENSITY}"
            mkdir -p "$RES_DIR"
            rsvg-convert -w ${SIZES[$DENSITY]} -h ${SIZES[$DENSITY]} "$SVG_PATH" -o "$RES_DIR/ic_launcher.png"
            rsvg-convert -w ${SIZES[$DENSITY]} -h ${SIZES[$DENSITY]} "$SVG_PATH" -o "$RES_DIR/ic_launcher_round.png"
            rsvg-convert -w ${FG_SIZES[$DENSITY]} -h ${FG_SIZES[$DENSITY]} "$SVG_PATH" -o "$RES_DIR/ic_launcher_foreground.png"
          done

          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0F766E</color>
          </resources>
          EOF

      - name: Inject CAMERA permission into AndroidManifest.xml
        run: |
          node -e '
            const fs = require("fs");
            const path = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(path)) {
              let xml = fs.readFileSync(path, "utf8");
              if (!xml.includes("android.permission.CAMERA")) {
                xml = xml.replace("<application", "    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <application");
                fs.writeFileSync(path, xml);
              }
            }
          '

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Compile Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload MASDETA Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MASDETA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
