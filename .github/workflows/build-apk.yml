name: Build & Release MASDETA APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build & Publish MASDETA APK
    runs-on: ubuntu-latest
    env:
      CI: true
      CAPACITOR_TELEMETRY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SVG converter
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Set Dynamic App Version
        id: ver
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="1.0.${BUILD_NUM}"
          VERSION_CODE=$((100 + BUILD_NUM))
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

          mkdir -p src/config
          cat << EOF > src/config/appVersion.ts
          export const APP_VERSION = "${VERSION_NAME}";
          export const APP_VERSION_CODE = ${VERSION_CODE};
          export const GITHUB_REPO = "vinsmokedomi-lab/MASDETA";
          EOF

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GAS_UPLOAD_URL: ${{ secrets.VITE_GAS_UPLOAD_URL }}
          VITE_GAS_API_KEY: ${{ secrets.VITE_GAS_API_KEY }}
        run: npm run build

      - name: Ensure Capacitor JSON config
        run: |
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.masdeta.app",
            "appName": "MASDETA",
            "webDir": "dist",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Generate MASDETA Launcher Icons
        run: |
          SVG_PATH="public/masdeta-icon.svg"
          if [ ! -f "$SVG_PATH" ]; then
            cat << 'EOF' > /tmp/masdeta-fallback.svg
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
              <rect width="512" height="512" rx="112" fill="#0F766E"/>
              <path d="M128 368V144h44l84 128 84-128h44v224h-44V222l-84 126-84-126v146h-44z" fill="#FFFFFF"/>
            </svg>
          EOF
            SVG_PATH="/tmp/masdeta-fallback.svg"
          fi

          declare -A SIZES=( ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192 )
          declare -A FG_SIZES=( ["mdpi"]=108 ["hdpi"]=162 ["xhdpi"]=216 ["xxhdpi"]=324 ["xxxhdpi"]=432 )

          for DENSITY in "${!SIZES[@]}"; do
            RES_DIR="android/app/src/main/res/mipmap-${DENSITY}"
            mkdir -p "$RES_DIR"
            rsvg-convert -w ${SIZES[$DENSITY]} -h ${SIZES[$DENSITY]} "$SVG_PATH" -o "$RES_DIR/ic_launcher.png"
            rsvg-convert -w ${SIZES[$DENSITY]} -h ${SIZES[$DENSITY]} "$SVG_PATH" -o "$RES_DIR/ic_launcher_round.png"
            rsvg-convert -w ${FG_SIZES[$DENSITY]} -h ${FG_SIZES[$DENSITY]} "$SVG_PATH" -o "$RES_DIR/ic_launcher_foreground.png"
          done

          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0F766E</color>
          </resources>
          EOF

      - name: Configure Deterministic Keystore, Permissions & Gradle Signing
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_NAME: ${{ secrets.KEY_ALIAS }}
          VER_NAME: ${{ steps.ver.outputs.version_name }}
          VER_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          PASS="${STORE_PASS:-MasdetaRelease2026!}"
          ALIAS="${KEY_ALIAS_NAME:-masdeta_key}"

          python3 - << 'PYEOF'
          import hashlib, math, os

          seed_str = f"{os.environ.get('STORE_PASS') or 'MasdetaRelease2026!'}:{os.environ.get('KEY_ALIAS_NAME') or 'masdeta_key'}"
          state = hashlib.sha256(seed_str.encode()).digest()

          def next_bytes(n):
              global state
              out = bytearray()
              while len(out) < n:
                  state = hashlib.sha256(state).digest()
                  out.extend(state)
              return bytes(out[:n])

          SMALL_PRIMES = [p for p in range(3, 1000, 2) if all(p % d != 0 for d in range(3, int(p**0.5) + 1, 2))]

          def is_prime(n):
              for p in SMALL_PRIMES:
                  if n % p == 0:
                      return n == p
              d, r = n - 1, 0
              while d % 2 == 0:
                  d //= 2
                  r += 1
              for _ in range(16):
                  a = 2 + int.from_bytes(next_bytes(128), 'big') % (n - 4)
                  x = pow(a, d, n)
                  if x == 1 or x == n - 1:
                      continue
                  for _ in range(r - 1):
                      x = pow(x, 2, n)
                      if x == n - 1:
                          break
                  else:
                      return False
              return True

          def gen_prime(bits):
              while True:
                  raw = bytearray(next_bytes(bits // 8))
                  raw[0] |= 0xC0
                  raw[-1] |= 0x01
                  cand = int.from_bytes(raw, 'big')
                  if is_prime(cand):
                      return cand

          e = 65537
          while True:
              p = gen_prime(1024)
              q = gen_
