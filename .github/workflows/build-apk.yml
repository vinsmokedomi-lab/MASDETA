name: Build MASDETA Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      CI: true
      CAPACITOR_TELEMETRY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GAS_UPLOAD_URL: ${{ secrets.VITE_GAS_UPLOAD_URL }}
          VITE_GAS_API_KEY: ${{ secrets.VITE_GAS_API_KEY }}
        run: npm run build

      - name: Replace TS config with JSON config
        run: |
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.masdeta.app",
            "appName": "MASDETA",
            "webDir": "dist",
            "android": {
              "allowMixedContent": true
            }
          }
          EOF

      - name: Add Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Inject CAMERA permission into AndroidManifest.xml
        run: |
          node -e '
            const fs = require("fs");
            const path = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(path)) {
              let xml = fs.readFileSync(path, "utf8");
              if (!xml.includes("android.permission.CAMERA")) {
                xml = xml.replace("<application", "    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <application");
                fs.writeFileSync(path, xml);
              }
            }
          '

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Compile Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload MASDETA Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MASDETA-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
